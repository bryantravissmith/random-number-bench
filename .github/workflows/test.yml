name: Test and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tests/test_batch.py
      - run: python tests/test_round.py
      - run: python tests/test_cli_runners.py
      - run: python tests/test_grid.py
      - run: python tests/test_grid_results.py
      - run: python tests/test_openrouter_profiles.py
      - run: python tests/test_analytics_coverage.py
      - run: python tests/test_analytics_analysis.py
      - name: Recount published results
        run: |
          python - <<'PY'
          from pathlib import Path
          import public_results
          for root in ("results", "probes"):
              for path in Path(root).glob("*/manifest.json"):
                  public_results.verify_public(path.parent)
          PY
      - name: Check generated report
        run: |
          python bench.py report
          python bench.py report --probes
          git diff --exit-code -- RESULTS.md PROBES.md
      - name: Check scientific visualization exports
        run: |
          python -m pip install matplotlib==3.11.2 numpy==2.5.4
          python tests/test_plot_results.py
